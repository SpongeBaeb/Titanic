<h1>중절모 남자 · 8칸 걷기 순환 미리보기</h1>

img.onload = () => { drawStrip(); requestAnimationFrame(loop); };
function drawStrip(){
  const c = document.getElementById('strip'); const k = 0.62; const pad = 18;
  const w = WALK.reduce((s,i)=>s+RECTS[i][2]*k+pad, pad); const h = 369*k + 40;
  c.width = w; c.height = h; const g = c.getContext('2d');
  g.fillStyle = '#1a2133'; g.fillRect(0,0,w,h);
  let x = pad;
  WALK.forEach((i,n)=>{ const [sx,sy,sw,sh] = RECTS[i];
    g.filter = 'brightness(2.6) contrast(1.15)';
    g.drawImage(img, sx,sy,sw,sh, x, h-30-sh*k, sw*k, sh*k); g.filter='none';
    g.fillStyle = '#f1e6cc'; g.font = '13px Malgun Gothic'; g.fillText(NAMES[n], x, 16);
    x += sw*k + pad; });
}
let gait = 0, last = performance.now(), pos = 0;
function drawWalker(g, k, x, y, f, blend, bright){
  const i0 = Math.floor(f) % 8, i1 = (i0+1) % 8, t = f - Math.floor(f);
  const put = (i, a) => { const [sx,sy,sw,sh,ax] = RECTS[WALK[i]]; g.globalAlpha = a; g.drawImage(img, sx,sy,sw,sh, x-ax*k, y-sh*k, sw*k, sh*k); };
  g.filter = bright ? 'brightness(2.6) contrast(1.15)' : 'none';
  put(i0, 1); if (blend && t > 0.05) put(i1, Math.min(1, t*1.15)); g.globalAlpha = 1; g.filter = 'none';
}
function scene(id, bright){
  const c = document.getElementById(id), g = c.getContext('2d');
  const gr = g.createLinearGradient(0,0,0,c.height); gr.addColorStop(0,'#0a0e1a'); gr.addColorStop(0.62,'#141a2a'); gr.addColorStop(0.63,'#3a2a1c'); gr.addColorStop(1,'#1d140d');
  g.fillStyle = gr; g.fillRect(0,0,c.width,c.height);
  for (let i=0;i<14;i++){ g.strokeStyle='rgba(255,210,150,0.05)'; g.beginPath(); g.moveTo(0,190+i*8); g.lineTo(c.width,190+i*8); g.stroke(); }
  const k = 0.62, H = 369*k, x = (pos % (c.width+160)) - 80;
  drawWalker(g, k, x, 280, gait, false, bright);
}
function loop(now){
  requestAnimationFrame(loop);
  let dt = Math.min(0.05,(now-last)/1000); last = now; if (document.getElementById('slow').checked) dt *= 0.25;
  const spd = +document.getElementById('spd').value; document.getElementById('spdv').textContent = spd.toFixed(2);
  const H = 369*0.62, v = spd*H;            // 키에 대한 비율로 정한 걷는 속도
  pos += v*dt;
  // 게임과 같은 규칙: 프레임마다 그림 속 디딘 발이 물러나는 거리(DIST)를 다 걸어야 다음 프레임으로 (발이 미끄러지지 않는다)
  let d = v*dt/H; for (let q=0; d>0 && q<16; q++){ const i=Math.floor(gait)%8, fr=gait-Math.floor(gait), need=(1-fr)*DIST[i]; if (d>=need){ d-=need; gait=Math.floor(gait)+1; } else { gait+=d/DIST[i]; d=0; } }
  scene('game', false); scene('bright', true);
  document.getElementById('fr').textContent = NAMES[Math.floor(gait)%8];
}
